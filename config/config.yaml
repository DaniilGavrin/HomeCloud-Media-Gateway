# HomeCloud Media Gateway — startup settings only.
# Rooms, TV devices, playbacks and runtime state MUST NOT be stored here.
config_version: 1

server:
  # Loopback for local development. Use an explicit private LAN/Tailscale IP
  # when the TV Player needs to connect from another device.
  host: "auto_private"
  port: 8091
  websocket_path: "/ws/stream"
  shutdown_timeout: "10s"

backend:
  # The WebSocket endpoint of HomeCloud WS Backend on this host.
  websocket_url: "ws://127.0.0.1:8080/ws"

heartbeat:
  interval: "20s"
  grace: "10s"

storage:
  # Explicit source owner routing. Disabled by default.
  # Example (uncomment for the actual approved HC SS node only):
  # source_nodes:
  #   storage-node-id: "ws://192.168.0.10:8092/ws/source"
  source_nodes: {}
  # Optional shared FS roots for SAME-HOST verified direct file reads:
  local_roots: {}
  # Relative to the process working directory, not the YAML directory.
  cache_dir: "data/media-cache"
  prefetch_limit_bytes: 1073741824  # 1 GiB, disk, not RAM
  max_cache_bytes: 10737418240     # 10 GiB, planned quota

limits:
  max_rooms: 4

# Optional media metadata inspection. Requires ffprobe in PATH on the Gateway
# host; disabled by default so a missing binary never breaks existing playback.
inspector:
  enabled: false
  binary: "ffprobe"
