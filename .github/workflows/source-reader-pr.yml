name: Media Gateway source-reader CI
on:
  pull_request:
    paths:
      - 'internal/source/**'
      - 'internal/app/**'
      - 'internal/mediahttp/**'
      - 'internal/directws/**'
      - '.github/workflows/source-reader-pr.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -count=1 ./...
      # Repeated race-detector runs cover the ready/control ordering regression.
      - run: go test -race -count=10 ./internal/directws ./internal/mediahttp
      - run: go vet ./...
